name: Deploy member portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: node --check portal.js
      - name: Check portal pages and reports
        run: node tests/frontend.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Stage public files only
        run: |
          mkdir _site
          cp index.html portal.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
